<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#f7f4ec">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="default">
	<meta name="apple-mobile-web-app-title" content="MadeForU">
	<link rel="manifest" href="/manifest.webmanifest">
	<link rel="icon" href="/icon.svg" type="image/svg+xml">
	<script id="google-identity" src="https://accounts.google.com/gsi/client" async defer></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
	<title>MadeForU — Local Crafts, Personal Moments</title>
	<style>
		:root {
			--paper:#f7f4ec; --white:#fff; --gold:#b48617; --gold-dark:#8c6912;
			--gold-light:#eadbb1; --ink:#171612; --muted:#858078; --line:#dedbd3;
			--green:#42c769; --shadow:0 4px 10px #27201420; --shell:480px;
		}
		*{box-sizing:border-box}
		[hidden]{display:none!important}
		body{margin:0;background:#e8e5de;color:var(--ink);font:15px/1.45 "Segoe UI",Arial,sans-serif}
		button,input,textarea,select{font:inherit}
		button{color:inherit}
		.app{position:relative;max-width:var(--shell);min-height:100vh;margin:0 auto;background:var(--paper);overflow:hidden;padding-bottom:86px}
		.topbar{min-height:54px;padding:5px 18px 10px;display:flex;align-items:center;gap:12px;background:var(--paper)}
		.topbar h1{font-size:23px;margin:0;text-align:center;flex:1;line-height:1.15;font-weight:700}
		.back{border:0;background:none;color:var(--gold);font-size:32px;line-height:1;padding:0 3px;cursor:pointer}
		.header-action{border:1px solid var(--gold);border-radius:11px;background:white;padding:7px 10px;color:var(--gold-dark);font-size:12px}
		.content{padding:10px 20px 28px}
		.content.tight{padding-left:14px;padding-right:14px}
		.home-head{margin:-54px -20px 28px;padding:12px 20px 14px;border-radius:0 0 29px 29px;background:linear-gradient(155deg,#c39a25,#a47c13 72%,#533d0a);color:white}
		.welcome-row{display:flex;align-items:center;gap:10px}
		.avatar{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;flex:none;border:2px solid #fff;background:radial-gradient(circle at 48% 32%,#f0c2a8 0 19%,transparent 20%),radial-gradient(ellipse at 50% 88%,#544234 0 35%,transparent 36%),linear-gradient(140deg,#d9b795,#796251);color:transparent;overflow:hidden}
		.welcome-name{font-family:Georgia,serif;font-size:19px;color:#fff4d8}
		.welcome-greet{font-weight:700;font-size:16px;margin-top:3px}
		.notice{margin-left:auto;border:0;border-radius:50%;width:46px;height:46px;background:#fff9e9;font-size:23px;position:relative}
		.notice small{position:absolute;right:4px;top:3px;color:#e22;background:white;border-radius:50%;font-size:9px;padding:1px 4px}
		.searchline{display:flex;gap:12px;margin:21px 2px -29px}
		.searchbox{height:51px;display:flex;align-items:center;gap:9px;padding:0 14px;border-radius:12px;border:1px solid #f7e9c2;background:#ffffff20;flex:1}
		.searchbox input{width:100%;border:0;outline:0;background:none;color:inherit;font-size:14px}
		.searchbox input::placeholder{color:inherit;opacity:.95}
		.filter-button{width:49px;border:1px solid white;border-radius:10px;color:white;background:transparent;font-size:25px}
		.promo{position:relative;min-height:216px;margin:0 -4px 22px;padding:19px 22px;border-radius:15px;overflow:hidden;background:linear-gradient(100deg,#fae8d4,#f6dfc6 56%,#f9eee2);color:#654a19}
		.promo:after{content:"🎁";position:absolute;right:17px;top:39px;font-size:95px;filter:drop-shadow(0 10px 7px #805a2944);transform:rotate(8deg)}
		.promo:before{content:"✦  ♡  ✦";position:absolute;right:20px;bottom:15px;color:#d4a449;font-size:23px}
		.promo-tag{display:inline-block;background:#d9af66;border-radius:12px;padding:5px 10px;color:white;font-size:10px;letter-spacing:1px;font-weight:700}
		.promo h2{font: bold 27px/1.08 Georgia,serif;margin:11px 0 8px;max-width:235px}
		.promo p{font-size:13px;max-width:220px;margin:0 0 12px;color:#5e5547}
		.promo button{border:0;border-radius:20px;background:#a47a17;color:white;padding:9px 16px;font-size:12px;box-shadow:var(--shadow)}
		.section-title{display:flex;align-items:center;justify-content:space-between;margin:19px 0 12px}
		.section-title h2{font:21px Georgia,serif;margin:0}
		.section-title button{border:0;background:none;color:var(--gold-dark);text-decoration:underline}
		.category-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:15px 0 19px;text-align:center}
		.category{border:0;background:transparent;padding:0;display:grid;justify-items:center;gap:4px;color:#51432c;font:12px/1.15 Georgia,serif;cursor:pointer}
		.category-icon{width:58px;height:58px;border-radius:50%;background:#efe5c8;display:grid;place-items:center;color:var(--gold-dark);font-size:27px;box-shadow:0 3px 4px #0002}
		.occasion-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
		.occasion{height:98px;border:0;border-radius:18px;background:linear-gradient(110deg,#f0e2ba 0 55%,#ead6b2);box-shadow:var(--shadow);overflow:hidden;position:relative;text-align:left;padding:13px 10px;color:#77530d;font:18px Georgia,serif;cursor:pointer}
		.occasion:after{content:attr(data-flower);position:absolute;right:-3px;top:-2px;bottom:0;width:46%;display:grid;place-items:center;background:linear-gradient(120deg,#d8d1c5,#f5e1d1);border-radius:43% 0 0 43%;font-size:44px}
		.add-bubble{position:absolute;bottom:8px;left:10px;width:23px;height:23px;background:#a77d18;border-radius:50%;color:white;text-align:center;font:20px/23px Arial}
		.pill-row{display:flex;gap:9px;overflow-x:auto;margin:8px -20px 14px;padding:4px 20px 8px;scrollbar-width:none}
		.pill{white-space:nowrap;border:1px solid var(--line);border-radius:22px;background:#fff;padding:9px 16px;font-size:13px;box-shadow:0 2px 3px #0001;cursor:pointer}
		.pill.active{background:var(--gold);border-color:var(--gold);color:white}
		.product-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px 14px}
		.product-card{border:0;border-radius:18px;background:white;padding:9px 9px 12px;box-shadow:var(--shadow);text-align:left;overflow:hidden;cursor:pointer}
		.product-photo{height:154px;margin:-1px -1px 7px;border-radius:14px;background:var(--tone,#f3e7d2);display:grid;place-items:center;position:relative;overflow:hidden}
		.product-photo:before,.product-photo:after{content:"";position:absolute;border-radius:50%;width:132px;height:132px;border:1px solid #ffffff99}
		.product-photo:after{width:170px;height:170px}
		.bloom{font-size:71px;position:relative;z-index:1;filter:drop-shadow(0 6px 5px #57412b44)}
		.product-title{font:18px/1.15 Georgia,serif;text-align:center;margin:3px 0 6px;min-height:40px}
		.product-price{font-size:14px;margin:3px 0}
		.product-foot{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#777}
		.product-status{border-radius:6px;padding:4px 7px;background:var(--gold);color:#fff;font-size:10px}
		.product-status.green{background:#42c769}
		.rating{font-size:12px;color:#514b40}
		.page-heading{font-size:23px;margin:5px 0 15px}
		.subheading{color:var(--muted);font-size:13px;margin:-9px 0 17px}
		.order-tabs{display:grid;grid-template-columns:repeat(3,1fr);margin:0 -6px 16px;background:white;border:1px solid var(--line);border-radius:8px;overflow:hidden}
		.order-tabs button{border:0;background:transparent;padding:12px 4px;color:#888;font-size:13px;font-weight:700}
		.order-tabs button.active{color:var(--gold);border-bottom:2px solid var(--gold)}
		.order-list{display:grid;gap:14px}
		.order-card{display:grid;grid-template-columns:82px 1fr auto;align-items:center;gap:12px;background:white;border-radius:22px;padding:11px 12px;min-height:112px}
		.order-thumb{height:82px;border-radius:13px;background:#f0e4d7;display:grid;place-items:center;font-size:42px}
		.order-info{font-size:13px;min-width:0}
		.order-info strong{display:block;font-weight:500;margin-bottom:3px}
		.order-info p{margin:1px 0;color:#777}
		.order-state{display:inline-block;background:var(--gold);color:white;border-radius:5px;padding:4px 8px;margin-top:5px;font-size:12px}
		.order-state.ready{background:var(--green)}
		.outline-btn{border:1px solid var(--gold);color:var(--gold-dark);background:var(--paper);border-radius:6px;padding:6px 12px;font-size:12px}
		.detail-hero{height:345px;margin:-10px -20px 17px;background:linear-gradient(135deg,#d5c1a8,#f1e4d5);display:grid;place-items:center;position:relative}
		.detail-hero .bloom{font-size:155px}
		.round-action{position:absolute;top:14px;width:45px;height:45px;border:0;border-radius:50%;background:white;font-size:24px;box-shadow:var(--shadow)}
		.round-action.left{left:10px}.round-action.right{right:10px}
		.detail-title{font-size:24px;margin:4px 0}
		.detail-price{color:var(--gold-dark);font-weight:700;font-size:20px}
		.detail-line{display:flex;justify-content:space-between;align-items:center;margin:8px 0}
		.maker-row{display:flex;align-items:center;gap:10px;margin:20px 0}
		.maker-row .avatar{width:56px;height:56px;border-color:var(--gold)}
		.maker-row button{margin-left:auto;border:1px solid var(--gold);background:transparent;color:var(--gold-dark);font-size:11px}
		.description{color:#555;line-height:1.6;margin:18px 4px}
		.quantity{display:flex;align-items:center;gap:12px}
		.quantity button{width:28px;height:28px;border:1px solid var(--gold);background:#fff}
		.primary-btn{width:100%;border:0;background:var(--gold);color:white;border-radius:28px;padding:14px 18px;font-size:17px;font-weight:700;cursor:pointer}
		.primary-btn:hover{background:var(--gold-dark)}
		.secondary-btn{width:100%;border:1px solid var(--gold);background:white;color:var(--gold-dark);border-radius:28px;padding:13px 10px;font-size:14px;font-weight:700;cursor:pointer}
		.detail-actions{display:grid;grid-template-columns:1fr 1.25fr;gap:8px}
		.footer-action{position:sticky;bottom:0;background:var(--paper);padding:12px 20px calc(13px + env(safe-area-inset-bottom));margin:15px -20px -20px}
		.checkout-card{background:white;border-radius:26px;padding:20px;margin:0 0 17px}
		.checkout-card h2{font-size:21px;margin:0 0 7px}
		.summary-line{display:flex;justify-content:space-between;margin:8px 0}
		.summary-line.total{border-top:1px solid var(--line);padding-top:12px;font-size:21px;font-weight:700}
		.choice-row{display:flex;gap:12px;margin:15px 0 4px}
		.choice{border:1px solid #555;background:white;padding:9px;border-radius:0;flex:1}
		.choice.selected{border-color:var(--gold);color:var(--gold-dark);background:#fffaf0}
		.radio-list{display:grid;gap:10px;margin-top:12px}
		.radio-list label{display:flex;align-items:center;gap:9px}
		input[type=radio]{accent-color:var(--gold)}
		.success-card{margin:28vh 4px 0;background:white;border:1px solid var(--gold);border-radius:23px;padding:30px;text-align:center}
		.success-mark{font-size:64px;color:var(--gold)}
		.success-card h2{color:var(--gold);font-size:29px;margin:0 0 22px}
		.progress-title{display:flex;gap:11px;align-items:center;margin:0 -4px 20px}
		.progress-title .back{font-size:32px}
		.progress{display:grid;grid-template-columns:repeat(6,1fr);margin:12px 2px 27px;position:relative}
		.progress:before{content:"";height:1px;background:#8e8879;position:absolute;top:14px;left:10%;right:10%}
		.progress span{position:relative;justify-self:center;width:29px;height:29px;border:1px solid var(--gold);border-radius:50%;background:white;text-align:center;font-weight:700;line-height:27px}
		.progress span.active{background:var(--gold);color:white}
		.builder-options{display:grid;grid-template-columns:1fr 1fr;gap:20px 22px;margin:75px 0 50px}
		.builder-option{border:1px solid var(--gold);background:white;min-height:160px;padding:0;display:grid;place-items:center;cursor:pointer}
		.builder-option.selected{outline:3px solid #b4861740}
		.builder-option .bloom{font-size:78px}
		.color-option{width:100px;height:100px;border-radius:50%;background:var(--swatch);border:8px solid white;box-shadow:0 0 0 1px var(--gold);justify-self:center}
		.builder-label{text-align:center;margin-top:-17px}
		.flower-color-filters{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0}
		.flower-color{display:grid;justify-items:center;gap:5px;border:0;background:transparent;font-size:11px;cursor:pointer}
		.flower-color i{width:34px;height:34px;border-radius:50%;background:var(--swatch);border:2px solid white;box-shadow:0 0 0 1px var(--line)}
		.flower-color.active i{box-shadow:0 0 0 2px var(--gold)}
		.detail-seller{border-top:1px solid var(--line);margin-top:15px;padding-top:12px}
		.detail-seller p{margin:5px 0;color:#615b50}
		.google-signin{min-height:44px;display:grid;place-items:center;margin:18px auto}
		.google-hint{font-size:12px;color:#777;text-align:center;line-height:1.55}
		.signin-logo{text-align:center;color:var(--gold-dark);font:32px Georgia,serif;margin:38px 0 12px}
		.auth-card{margin-top:10px;padding:20px;background:#fff;border-radius:22px}
		.role-picker{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
		.role-choice{padding:10px;border:1px solid var(--gold);border-radius:11px;background:white}
		.role-choice.active{background:var(--gold);color:white}
		.builder-footer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,var(--shell));display:flex;padding:12px 20px calc(15px + env(safe-area-inset-bottom));background:var(--paper);z-index:5}
		.builder-footer button{width:50%;height:45px;border:1px solid var(--gold);font-size:16px}
		.builder-footer .back-btn{border-radius:24px 0 0 24px;background:white}
		.builder-footer .next-btn{border-radius:24px;background:var(--gold);color:white;margin-left:-7px}
		.note-box{width:100%;height:150px;padding:18px;border:0;border-radius:22px;box-shadow:inset 0 2px 5px #0004;resize:vertical;font-size:15px}
		.style-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin:45px 24px}
		.style-choice{height:100px;border:1px solid var(--gold);border-radius:19px;background:white;font-size:18px;font-weight:700}
		.style-choice.selected{background:#fff6dc}
		.small-label{font-weight:700;margin:14px 0 8px}
		.form{display:grid;gap:14px}
		.form label{font-weight:600;display:grid;gap:6px}
		.form input,.form select,.form textarea{width:100%;border:1px solid #aaa;border-radius:10px;background:white;padding:12px 14px}
		.form textarea{min-height:95px;resize:vertical}
		.review-card,.profile-card,.seller-card{background:white;border-radius:18px;padding:17px;margin-bottom:14px}
		.review-stars{color:#e8a700;font-size:33px;letter-spacing:7px;margin:8px 0}
		.profile-banner{background:linear-gradient(125deg,#4c382a,#b99468);height:114px;margin:-10px -20px 0}
		.profile-summary{position:relative;background:white;border-radius:26px 26px 0 0;margin:-28px -20px 0;padding:16px 21px 12px;display:grid;grid-template-columns:82px 1fr;align-items:center;gap:10px}
		.profile-summary .avatar{width:88px;height:88px}
		.profile-stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);text-align:center;padding:12px 0 4px;border-top:1px solid var(--line)}
		.profile-stats div+div{border-left:1px solid var(--line)}
		.profile-stats strong{display:block}
		.profile-links{background:white;border:1px solid #e8dfd1;border-radius:16px;padding:0 14px}
		.profile-link{display:flex;align-items:center;gap:13px;min-height:57px;border-bottom:1px solid #eee9e0}
		.profile-link:last-child{border-bottom:0}
		.profile-link .link-icon{width:28px;font-size:24px;color:#76511b}
		.profile-link span:nth-child(2){flex:1}
		.profile-link small{display:block;color:#8b9298;font-size:11px}
		.profile-link button{border:0;background:transparent;font-size:20px;color:#7a6a55}
		.metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
		.metric{border-radius:17px;background:#eadbb1;padding:13px 12px;min-height:104px}
		.metric-icon{width:34px;height:34px;display:grid;place-items:center;background:var(--gold);border-radius:50%;color:white;font-size:20px}
		.metric strong{display:block;font-size:18px;margin-top:5px}
		.metric small{color:#71613e}
		.chart.sales-chart{margin:18px 0;background:white;padding:15px 10px 18px;border:1px solid #e8dfd1;border-radius:18px;box-shadow:var(--shadow)}
		.sales-chart-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 4px 14px}
		.sales-chart-heading h2{font:19px Georgia,serif;margin:0}
		.current-month{white-space:nowrap;border-radius:16px;background:#fff3d4;color:var(--gold-dark);padding:6px 9px;font-size:10px;font-weight:700}
		.month-chart{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px;align-items:end}
		.month-column{min-width:0;padding:4px 1px 3px;text-align:center;border-radius:8px 8px 5px 5px}
		.month-column.current{background:#fff8e7}
		.month-count{display:block;height:16px;overflow:hidden;color:#756647;font-size:9px;line-height:16px}
		.bar-track{height:112px;display:flex;align-items:end;border-bottom:1px solid var(--line)}
		.sales-bar{width:72%;min-height:2px;margin:0 auto;background:linear-gradient(#c49426,#a87912);border-radius:5px 5px 0 0}
		.month-column.current .sales-bar{background:linear-gradient(#eccb70,#a87912)}
		.month-label{display:block;margin-top:4px;color:#777;font-size:10px}
		.no-month-sales{margin:12px 0 0;text-align:center;color:#777;font-size:12px}
		.gift-media{margin-top:14px;padding:14px;background:#fff9e9;border:1px solid #eadbb1;border-radius:14px}
		.gift-qr{display:grid;place-items:center;width:196px;height:196px;margin:12px auto;background:#fff}
		.gift-qr img,.gift-qr canvas{max-width:180px;max-height:180px}
		.gift-media a{overflow-wrap:anywhere}
		.print-gift{margin-top:8px}
		.seller-row{display:grid;grid-template-columns:49px 1fr auto;gap:10px;align-items:center;border-bottom:1px solid #eee;padding:10px 0}
		.seller-thumb{width:49px;height:49px;border-radius:12px;background:#eee3d7;display:grid;place-items:center;font-size:28px}
		.seller-row small{display:block;color:#888}
		.chat-messages{display:flex;flex-direction:column;gap:4px;min-height:180px;padding-bottom:72px}
		.message{max-width:82%;display:grid;gap:5px;padding:12px 15px;border:1px solid var(--gold);border-radius:15px;background:white;margin:8px 0;font-size:15px;overflow-wrap:anywhere}
		.message small{font-size:10px;opacity:.72}
		.message.mine{margin-left:auto;background:var(--gold);color:white;border:0}
		.message-person{display:flex;gap:10px;align-items:center;margin:3px 0 14px}
		.message-input{display:flex;gap:8px;margin-top:30px;position:sticky;bottom:86px;padding:8px 0;background:var(--paper)}
		.message-input input{flex:1;border:1px solid var(--line);border-radius:22px;padding:10px 14px}
		.message-input button{border:0;border-radius:50%;background:var(--gold);color:white;width:44px}
		.bottom-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,var(--shell));height:79px;padding:7px 3px calc(7px + env(safe-area-inset-bottom));background:white;border-radius:17px 17px 0 0;box-shadow:0 -2px 10px #0000000c;display:grid;grid-template-columns:repeat(5,1fr);z-index:6}
		.bottom-nav button{border:0;background:transparent;color:#999;display:grid;justify-items:center;align-content:center;gap:0;font-size:10px}
		.bottom-nav button.active{color:var(--gold)}
		.bottom-icon{font-size:26px;line-height:1.2}
		.toast{position:fixed;z-index:20;bottom:93px;left:50%;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:#24211a;color:white;border-radius:22px;padding:10px 17px;font-size:13px;transition:.2s}
		.toast.show{opacity:1;transform:translate(-50%,0)}
		.empty{grid-column:1/-1;text-align:center;padding:40px 15px;color:var(--muted);background:#fff;border-radius:18px}
		@media print{body{background:white}.app{max-width:none;min-height:0;padding:0;overflow:visible}.topbar,.bottom-nav,.toast{display:none!important}.gift-media{break-inside:avoid}}
		@media(min-width:700px){body{padding:24px 0}.app{min-height:calc(100vh - 48px);border-radius:28px;box-shadow:0 12px 50px #28211622}.bottom-nav{bottom:24px;border-radius:17px}.builder-footer{bottom:24px}.toast{bottom:114px}}
		@media(max-width:370px){.content{padding-left:15px;padding-right:15px}.product-photo{height:132px}.product-title{font-size:16px}.promo h2{font-size:24px}.order-card{grid-template-columns:68px 1fr auto;gap:8px}.order-thumb{height:68px}}
	</style>
</head>
<body>
	<div class="app">
		<header class="topbar" id="topbar"></header>
		<main class="content" id="main"></main>
		<nav class="bottom-nav" id="bottom-nav" aria-label="Main navigation"></nav>
	</div>
	<div class="toast" id="toast" role="status" aria-live="polite"></div>
	<script>
		const state = {
			products: [], orders: [], conversations: [], profile: {}, user: null, googleClientId: '', mode: 'shop', view: 'signin',
			query: '', category: 'All', colorFilter: 'All', stockFilter: '', orderTab: 'New Orders', selected: null,
			authRole: 'customer', pendingView: '', pendingSellerView: '', googleInitializedFor: '', signInPending: false,
			quantity: 1, cart: {}, checkoutItems: {}, delivery: 'Delivery', payment: 'Cash on Delivery',
			giftMediaRequested: false, giftMediaUrl: '', giftMediaVerifiedUrl: '', giftMediaMimeType: '', giftMediaVerifying: false,
			selectedConversationId: '',
			builderStep: 1, builder: {flower:'Rose', color:'Pink', productId:'', alignment:'Medium', wrapper:'Pink', ribbon:'Pink', message:'', style:'Classic'},
			messages: []
		};
		const main = document.getElementById('main');
		const topbar = document.getElementById('topbar');
		const bottomNav = document.getElementById('bottom-nav');
		let toastTimer;
		let messagePollTimer = null;
		let messagePollInFlight = false;
		const customerNav = [['home','⌂','Home'],['search','⌕','Search'],['orders','▤','Orders'],['cart','🛒','Cart'],['profile','♙','Profile']];
		const sellerNav = [['seller-dashboard','▦','Dashboard'],['seller-products','▤','Product'],['seller-orders','☷','Orders'],['messages','●','Messages'],['seller-profile','♟','Profile']];
		const colorSwatches = {Red:'#e64242',Pink:'#ec91a9',White:'#fff',Yellow:'#f5ce42',Purple:'#9b69b4',Blue:'#739bd5',Orange:'#ef984a',Mixed:'linear-gradient(135deg,#ed5b5b,#f0d54e,#7c6dcc)'};
		const colorTints = {Red:'#f2d5d3',Pink:'#f4dce4',White:'#f0eee8',Yellow:'#f5edcf',Purple:'#e8dff0',Blue:'#dce7f3',Orange:'#f4e1d3',Mixed:'#eee3d7'};
		const flowerEmoji = {Rose:'🌹',Tulip:'🌷',Sunflower:'🌻',Lily:'🌸',Carnation:'🌸',Daisy:'🌼',Orchid:'🪷','Mixed Bouquet':'💐'};
		function flowerTint(name){return colorTints[name]||'#f5eee4';}
		function escapeHtml(value) {
			return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
		}
		function peso(cents) {
			return '₱ ' + (Number(cents || 0) / 100).toLocaleString('en-PH', {minimumFractionDigits:0, maximumFractionDigits:2});
		}
		function notify(message) {
			const toast = document.getElementById('toast');
			toast.textContent = message;
			toast.classList.add('show');
			clearTimeout(toastTimer);
			toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
		}
		async function signOutCurrentAccount() {
			try {
				await api('/api/auth/logout',{});
				state.user=null;
				state.products=[];
				state.orders=[];
				state.conversations=[];
				state.profile={};
				state.pendingView='';
				state.selectedConversationId='';
				state.authRole='customer';
				state.view='signin';
				await refresh();
				notify('You are signed out.');
			} catch(error) {
				notify(error.message);
			}
		}
		function printGiftQr(order) {
			const printWindow=window.open('','_blank','width=620,height=760');
			if(!printWindow){notify('Allow pop-ups to print the gift QR code.');return;}
			const link=escapeHtml(order.giftMediaUrl);
			printWindow.document.write(`<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Gift QR · ${escapeHtml(order.id)}</title><style>body{font:16px Arial,sans-serif;text-align:center;padding:32px;color:#222}#gift-qr{width:260px;height:260px;margin:20px auto}a{display:block;overflow-wrap:anywhere;color:#333}button{padding:10px 18px}@media print{button{display:none}}</style></head><body><h1>MadeForU Gift Media</h1><p>Order ${escapeHtml(order.id)}</p><div id="gift-qr" aria-label="QR code for customer gift media"></div><a href="${link}" target="_blank" rel="noopener noreferrer">${link}</a><p>Scan the QR code to view the customer’s gift photo or video.</p><button id="print-button">Print</button></body></html>`);
			printWindow.document.close();
			printWindow.document.getElementById('print-button').onclick=()=>printWindow.print();
			if(!window.QRCode){notify('QR generation is unavailable. Check your internet connection and try again.');return;}
			new QRCode(printWindow.document.getElementById('gift-qr'),{text:order.giftMediaUrl,width:260,height:260,correctLevel:QRCode.CorrectLevel.M});
			window.setTimeout(()=>printWindow.print(),300);
		}
		function saveGiftQr(order) {
			const mount=Array.from(main.querySelectorAll('[data-gift-qr]')).find(element=>element.dataset.giftQr===order.id);
			const image=mount?.querySelector('img');
			const canvas=mount?.querySelector('canvas');
			const dataUrl=image?.src.startsWith('data:image/')?image.src:canvas?.toDataURL('image/png');
			if(!dataUrl){notify('The QR code is not ready to save yet.');return;}
			const download=document.createElement('a');
			download.href=dataUrl;download.download=`MadeForU-${order.id}-gift-qr.png`;
			document.body.appendChild(download);download.click();download.remove();
		}
		async function api(path, values) {
			const response = await fetch(path, {
				method: values ? 'POST' : 'GET',
				headers: values ? {'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'} : {},
				body: values ? new URLSearchParams(values) : undefined
			});
			const data = await response.json();
			if (!response.ok) throw new Error(data.message || 'The request could not be completed.');
			return data;
		}
		function applyAccountState(data) {
			state.products = data.products;
			state.orders = data.orders;
			state.conversations = data.conversations || [];
			state.profile = data.profile || {};
		}
		async function refresh() {
			try {
				const data = await api('/api/state');
				applyAccountState(data);
				const [config, auth] = await Promise.all([api('/api/auth/config'),api('/api/auth/me')]);
				state.googleClientId = config.googleClientId || '';
				state.user = auth.user;
				state.mode = state.user?.role === 'seller' ? 'seller' : 'shop';
				if (state.user && state.view === 'signin') state.view = state.user.role === 'seller' ? 'seller-dashboard' : 'home';
				render();
				if (state.view === 'signin') renderGoogleButton();
			} catch (error) {
				topbar.innerHTML = '<h1>MadeForU</h1>';
				main.innerHTML = `<div class="empty"><strong>We couldn’t connect to the shop.</strong><p>${escapeHtml(error.message)}</p><button class="primary-btn" id="retry">Try again</button></div>`;
				document.getElementById('retry').onclick = refresh;
			}
		}
		function setView(view) {
			const sellerView = view.startsWith('seller-') || view === 'add-product';
			const needsCustomer = ['orders','checkout','profile'].includes(view);
			if (view !== 'signin' && !state.user) {
				state.authRole = sellerView ? 'seller' : 'customer';
				state.pendingView = view;
				state.view = 'signin';
				render();
				if (state.view === 'signin') renderGoogleButton();
				return;
			}
			if (sellerView && state.user?.role !== 'seller') {
				notify('Seller tools belong to a separate seller account. Sign out from Profile, then sign in as a seller.');
				return;
			}
			if (needsCustomer && state.user?.role !== 'customer') {
				notify('Orders and checkout belong to a customer account. Sign out from Profile, then sign in as a customer.');
				return;
			}
			if (view === 'messages' && !['customer','seller'].includes(state.user?.role)) {
				notify('Sign in to open messages.');
				return;
			}
			if (view === 'add-product' && !state.profile.shopName) {
				state.pendingSellerView = 'add-product';
				view = 'seller-profile';
			}
			if (view !== 'messages') stopMessagePolling();
			state.view = view;
			if (sellerView) state.mode = 'seller';
			else if (view !== 'checkout' && view !== 'details' && view !== 'builder' && view !== 'success') state.mode = 'shop';
			render();
			window.scrollTo(0, 0);
		}
		function header(title, back = '', action = '') {
			topbar.innerHTML = `${back ? `<button class="back" data-back="${escapeHtml(back)}" aria-label="Go back">‹</button>` : '<span style="width:28px"></span>'}<h1>${title}</h1>${action}`;
			const button = topbar.querySelector('[data-back]');
			if (back) button.onclick = () => setView(back);
		}
		function drawNav() {
			const links = state.mode === 'seller' ? sellerNav : customerNav;
			bottomNav.hidden = ['builder','checkout','success','signin'].includes(state.view);
			bottomNav.innerHTML = links.map(([view, icon, label]) => `<button type="button" class="${state.view === view ? 'active' : ''}" data-view="${view}"><span class="bottom-icon">${icon}</span>${label}</button>`).join('');
			bottomNav.querySelectorAll('[data-view]').forEach(button => button.onclick = () => {
				if (button.dataset.view === 'cart') return openCart();
				setView(button.dataset.view);
			});
		}
		function bloomFor(product) { return escapeHtml(product.emoji || '💐'); }
		function avatarMarkup(user, fallback = '✿') {
			const picture = user?.picture && /^https:\/\/[^"'<>]+$/i.test(user.picture)
				? `<img src="${escapeHtml(user.picture)}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
				: escapeHtml((user?.name || fallback).slice(0,1).toUpperCase());
			return `<div class="avatar">${picture}</div>`;
		}
		function renderGoogleButton() {
			const mount = document.getElementById('google-button');
			if (!mount || state.view !== 'signin') return;
			mount.innerHTML = '';
			if (state.signInPending) {
				mount.innerHTML = '<p class="google-hint" role="status">Signing you in…</p>';
				return;
			}
			if (!state.googleClientId) {
				mount.innerHTML = '<p class="google-hint"><strong>Google sign-in needs setup.</strong><br>Create an OAuth 2.0 Web client in <a href="https://console.cloud.google.com/auth/clients" target="_blank" rel="noopener noreferrer">Google Cloud Console</a>, authorize <code>http://localhost:8080</code>, then restart the Java server with its client ID in <code>GOOGLE_CLIENT_ID</code>. Never enter or share your Google password with this app.</p>';
				return;
			}
			if (!window.google?.accounts?.id) {
				const script = document.getElementById('google-identity');
				if (script) {
					script.addEventListener('load', renderGoogleButton, {once:true});
					script.addEventListener('error',()=>{mount.innerHTML='<p class="google-hint">Google sign-in could not load. Check your internet connection and reload the page.</p>';},{once:true});
				}
				return;
			}
			if (state.googleInitializedFor !== state.googleClientId) {
				window.google.accounts.id.initialize({
					client_id:state.googleClientId,
					callback:async response=>{
						if (state.signInPending) return;
						state.signInPending = true;
						const selectedRole = state.authRole;
						renderGoogleButton();
						try {
							const result=await api('/api/auth/google',{credential:response.credential,role:selectedRole});
							state.user=result.user;
							state.products=[];
							state.orders=[];
							state.conversations=[];
							state.profile={};
							applyAccountState(await api('/api/state'));
							state.mode=state.user.role==='seller'?'seller':'shop';
							const requestedView=state.pendingView;
							const sellerView=requestedView.startsWith('seller-')||requestedView==='add-product';
							const customerView=['orders','checkout','profile'].includes(requestedView);
							const canUseRequestedView=requestedView && (!sellerView||state.user.role==='seller') && (!customerView||state.user.role==='customer');
							const destination=canUseRequestedView?requestedView:(state.user.role==='seller'?'seller-dashboard':'home');
							state.pendingView='';
							state.signInPending=false;
							setView(destination);
							notify(`Signed in as ${state.user.name}.`);
						} catch(error) {
							state.signInPending=false;
							renderGoogleButton();
							notify(error.message);
						}
					}
				});
				state.googleInitializedFor=state.googleClientId;
			}
			window.google.accounts.id.renderButton(mount,{
				type:'standard',theme:'outline',size:'large',shape:'pill',
				text:'continue_with',width:Math.min(320,Math.max(230,window.innerWidth-80))
			});
		}
		function renderSignIn() {
			header('Sign in');
			main.innerHTML=`<div class="signin-logo">MadeForU</div><div style="text-align:center"><h2 style="margin:0">Welcome to MadeForU</h2><p class="subheading" style="margin:5px 0 16px">Sign in to continue to handmade, fresh flowers</p></div><section class="auth-card"><h3 style="margin:0">Continue with your Google account</h3><div class="role-picker"><button class="role-choice ${state.authRole==='customer'?'active':''}" data-role="customer">Shop for flowers</button><button class="role-choice ${state.authRole==='seller'?'active':''}" data-role="seller">Sell fresh flowers</button></div><div class="google-signin" id="google-button"></div><p class="google-hint">Sign in with your own Google account. No account is pre-created for you.</p></section>`;
			main.querySelectorAll('[data-role]').forEach(button=>button.onclick=()=>{state.authRole=button.dataset.role;state.pendingView='';renderSignIn();renderGoogleButton();});
			renderGoogleButton();
		}
		function productCard(product) {
			const tone = escapeHtml(flowerTint(product.flowerColor));
			return `<button class="product-card" type="button" data-product="${escapeHtml(product.id)}">
				<span class="product-photo" style="--tone:${tone};background:linear-gradient(135deg,${tone},#fff)"><span class="bloom" style="filter:drop-shadow(0 6px 5px #57412b44)">${bloomFor(product)}</span></span>
				<span class="product-title">${escapeHtml(product.name)}</span><span class="product-price">${peso(product.priceCents)}</span>
				<span class="product-foot"><span><i style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${escapeHtml(colorSwatches[product.flowerColor] || '#ddd')};border:1px solid #bbb"></i> ${escapeHtml(product.flowerColor || '')} · ${escapeHtml(product.category || '')}</span><span class="product-status green">Fresh</span></span>
			</button>`;
		}
		function renderHome() {
			header('');
			topbar.classList.add('home-top');
			const categories = [['🌹','Rose'],['🌷','Tulip'],['🌻','Sunflower'],['💐','Mixed Bouquet']];
			const occasions = [['Birthday','💐'],['Graduation','🌻'],['Valentines','🌷'],['Graduation','🌹']];
			const availableFlowers=state.products.filter(product=>product.stock>0 && product.handmade);
			main.className = 'content';
			main.innerHTML = `<section class="home-head">
				<div class="welcome-row">${avatarMarkup(state.user,'M')}<div><div class="welcome-name">MadeForU</div><div class="welcome-greet">${state.user?`Welcome, ${escapeHtml(state.user.name)}`:'Fresh flowers, handmade for you'}</div></div><button class="notice" id="account-open" aria-label="${state.user?'Open account':'Sign in'}">♙</button></div>
				<div class="searchline"><label class="searchbox"><span>⌕</span><input id="home-search" placeholder="Search flowers, colors, and makers"></label><button class="filter-button" data-view="search" aria-label="Open filters">☷</button></div>
			</section>
			<section class="promo"><span class="promo-tag">✿ &nbsp; HANDMADE &amp; FRESH</span><h2>Fresh Flowers<br>Made for You</h2><p>Shop hand-tied bouquets from local flower makers.</p><button data-view="search">Shop fresh flowers &nbsp;→</button></section>
			<div class="category-grid">${categories.map(([icon,name]) => `<button class="category" data-category="${escapeHtml(name)}"><span class="category-icon">${icon}</span><span>${name}</span></button>`).join('')}</div>
			<div class="section-title"><h2>Handmade &amp; fresh near you</h2>${availableFlowers.length?'<button data-view="search">See all</button>':''}</div>
			${availableFlowers.length?`<div class="product-grid">${availableFlowers.slice(0,4).map(productCard).join('')}</div><div class="section-title"><h2>Create a bouquet</h2></div><div class="occasion-grid">${occasions.map(([name,flower]) => `<button class="occasion" data-flower="${flower}" data-builder="1">${name}<span class="add-bubble">+</span></button>`).join('')}</div>`:'<div class="empty"><strong>No flowers are for sale yet.</strong><p>Flower listings will appear here when a seller adds them. Sellers can sign in and publish the first fresh, handmade flowers.</p></div>'}`;
			document.getElementById('home-search').addEventListener('keydown', event => { if (event.key === 'Enter') { state.query = event.target.value; setView('search'); } });
			document.getElementById('account-open').onclick = () => setView('profile');
			main.querySelectorAll('[data-view="search"]').forEach(button=>button.onclick=()=>setView('search'));
			main.querySelectorAll('[data-category]').forEach(button => button.onclick = () => { state.category = button.dataset.category; setView('search'); });
			main.querySelectorAll('[data-builder]').forEach(button => button.onclick = () => {state.builder.flower=button.dataset.flower==='🌻'?'Sunflower':button.dataset.flower==='🌷'?'Tulip':button.dataset.flower==='🌹'?'Rose':'Mixed Bouquet';state.builderStep=1;setView('builder');});
			main.querySelectorAll('[data-product]').forEach(button=>button.onclick=()=>openProduct(button.dataset.product));
		}
		function renderSearch() {
			header('Bouquets', 'home');
			const types=['All',...new Set(state.products.map(product=>product.flowerType || product.category))];
			const colors=['All',...new Set(state.products.map(product=>product.flowerColor).filter(Boolean))];
			const products = state.products.filter(product => {
				const text = [product.name,product.description,product.category,product.maker,product.flowerColor,product.flowerType].join(' ').toLowerCase();
				const queryMatch = !state.query || text.includes(state.query.toLowerCase());
				const categoryMatch = state.category === 'All' || (product.flowerType || product.category) === state.category;
				const colorMatch = state.colorFilter === 'All' || product.flowerColor === state.colorFilter;
				return queryMatch && categoryMatch && colorMatch && product.stock > 0 && product.handmade;
			});
			main.innerHTML = `<div class="pill-row">${types.map(name => `<button class="pill ${state.category===name?'active':''}" data-type="${escapeHtml(name)}">${escapeHtml(name)}</button>`).join('')}</div><p class="small-label">Flower color</p><div class="flower-color-filters">${colors.map(name=>`<button class="flower-color ${state.colorFilter===name?'active':''}" data-color="${escapeHtml(name)}"><i style="--swatch:${name==='All'?'#fff':colorSwatches[name]||'#fff'}"></i>${escapeHtml(name)}</button>`).join('')}</div><div class="product-grid">${products.length ? products.map(productCard).join('') : '<div class="empty">No fresh handmade flowers match those filters yet.</div>'}</div>`;
			main.querySelectorAll('[data-type]').forEach(button => button.onclick = () => { state.category=button.dataset.type; renderSearch(); });
			main.querySelectorAll('[data-color]').forEach(button => button.onclick = () => { state.colorFilter=button.dataset.color; renderSearch(); });
			main.querySelectorAll('[data-product]').forEach(button => button.onclick = () => openProduct(button.dataset.product));
		}
		function openProduct(id) {
			state.selected = state.products.find(product => product.id === id);
			state.quantity = 1;
			if (!state.selected) return;
			setView('details');
		}
		function renderDetails() {
			const product = state.selected;
			if (!product) return setView('search');
			header('Product Details','search');
			main.innerHTML = `<div class="detail-hero" style="background:linear-gradient(135deg,${escapeHtml(flowerTint(product.flowerColor))},#d0b89b)"><button class="round-action left" data-back="search">‹</button><span class="bloom">${bloomFor(product)}</span></div>
				<h2 class="detail-title">${escapeHtml(product.name)}</h2><div class="detail-line"><span class="detail-price">${peso(product.priceCents)}</span><span class="rating">⭐ 4.8</span></div>
				<div class="detail-line"><span>🌸 ${escapeHtml(product.flowerType || product.category)} · ${escapeHtml(product.flowerColor)}</span><span class="product-status green">Fresh · ${product.stock} available</span></div>
				<div class="maker-row">${avatarMarkup({name:product.sellerName},'F')}<div>By ${escapeHtml(product.maker)} <span style="color:var(--gold)">✿</span><small style="display:block">${escapeHtml(product.sellerLocation)}</small></div></div>
				<p class="description">${escapeHtml(product.description)}</p><section class="detail-seller"><strong>Handmade by the seller</strong><p>Freshness: ${escapeHtml(product.freshness)}</p><p>Seller: ${escapeHtml(product.sellerName)}</p><p>Shop: ${escapeHtml(product.maker)}</p><p>Location: ${escapeHtml(product.sellerLocation)}</p><p><a href="tel:${escapeHtml(product.sellerPhone)}">${escapeHtml(product.sellerPhone)}</a></p><p><a href="mailto:${escapeHtml(product.sellerEmail)}">${escapeHtml(product.sellerEmail)}</a></p></section>
				<div class="detail-line"><span>Fresh stems available: ${product.stock}</span><div class="quantity"><button id="minus">−</button><span id="qty">${state.quantity}</span><button id="plus">+</button></div></div>
				<div class="footer-action"><div class="detail-actions"><button class="secondary-btn" id="add-cart">Add to Cart</button><button class="primary-btn" id="buy">Buy Now</button></div></div>`;
			main.querySelector('[data-back]').onclick = () => setView('search');
			document.getElementById('minus').onclick = () => { state.quantity = Math.max(1,state.quantity-1); document.getElementById('qty').textContent = state.quantity; };
			document.getElementById('plus').onclick = () => { state.quantity = Math.min(product.stock || 99,state.quantity+1); document.getElementById('qty').textContent = state.quantity; };
			document.getElementById('add-cart').onclick = () => { state.cart[product.id]=(state.cart[product.id]||0)+state.quantity; notify('Added to your cart.'); openCart(); };
			document.getElementById('buy').onclick = () => { state.checkoutItems = {[product.id]:state.quantity}; setView('checkout'); };
		}
		function openCart() {
			state.view='cart';
			render();
		}
		function renderCart() {
			header('Your Cart','search');
			const lines=Object.entries(state.cart).map(([id,quantity])=>({product:state.products.find(item=>item.id===id),quantity})).filter(line=>line.product);
			const subtotal=lines.reduce((sum,line)=>sum+line.product.priceCents*line.quantity,0);

			if(verifyGift)verifyGift.onclick=async()=>{state.giftMediaUrl=giftInput.value.trim();if(!state.giftMediaUrl){giftInput.focus();return notify('Paste a Google Drive link first.');}state.giftMediaVerifying=true;verifyGift.disabled=true;verifyGift.textContent='Checking public access…';const status=main.querySelector('#gift-link-status');status.textContent='Checking that the file opens publicly…';try{const result=await api('/api/drive/verify',{url:state.giftMediaUrl});state.giftMediaVerifiedUrl=state.giftMediaUrl;state.giftMediaMimeType=result.mimeType;status.textContent=`Verified public ${result.mimeType.startsWith('video/')?'video':'photo'}. The seller will see it with your order.`;status.style.color='#268341';}catch(error){state.giftMediaVerifiedUrl='';state.giftMediaMimeType='';status.textContent=error.message;status.style.color='#a33';}finally{state.giftMediaVerifying=false;verifyGift.disabled=false;verifyGift.textContent='Verify public link';}};

			typeSelect.onchange=()=>main.querySelector('[name="emoji"]').value=flowerEmoji[typeSelect.value]||'💐';
			main.querySelector('[name="flowerColor"]').onchange=event=>main.querySelector('[name="color"]').value=colorTints[event.target.value]||'#f1d8dc';
			document.getElementById('add-product-form').onsubmit=async event=>{event.preventDefault();const data=Object.fromEntries(new FormData(event.currentTarget));try{await api('/api/seller/products',data);await refresh();setView('seller-products');notify('Fresh flower listing published.');}catch(error){notify(error.message);}};
		}
		function renderSellerOrders() {
			header('Orders');
			const statuses=['Pending','Preparing','Out for delivery','Delivered'];
			main.innerHTML=state.orders.length?state.orders.slice().reverse().map(order=>`<article class="seller-card"><div class="seller-row" style="grid-template-columns:1fr auto"><span><strong>Order #${escapeHtml(order.id)}</strong><small>${escapeHtml(order.customer)} · ${escapeHtml(order.email)}</small></span><span>${peso(order.sellerSubtotalCents)}</span></div><p>${order.lines.map(line=>`${escapeHtml(line.emoji)} ${escapeHtml(line.name)} × ${line.quantity}`).join(', ')}</p>${order.giftMediaUrl?`<section class="gift-media"><strong>🎁 Customer gift photo/video</strong><p>Public link verified at checkout. Scan or print this QR for delivery.</p><a href="${escapeHtml(order.giftMediaUrl)}" target="_blank" rel="noopener noreferrer">Open gift media</a><div class="gift-qr" data-gift-qr="${escapeHtml(order.id)}" aria-label="QR code linking to customer gift media"></div><button class="outline-btn print-gift" type="button" data-print-gift="${escapeHtml(order.id)}">Print gift QR</button><button class="outline-btn print-gift" type="button" data-save-gift="${escapeHtml(order.id)}">Save QR image</button></section>`:''}<div class="detail-line"><span class="order-state">${escapeHtml(order.status)}</span><select data-status="${escapeHtml(order.id)}" aria-label="Update status" class="header-action">${statuses.map(status=>`<option ${order.status===status?'selected':''}>${status}</option>`).join('')}</select></div><button class="outline-btn" data-message="${escapeHtml(order.id)}">Message Customer</button></article>`).join(''):'<div class="empty">No orders yet. New customer orders will appear here.</div>';
			main.querySelectorAll('[data-gift-qr]').forEach(mount=>{const order=state.orders.find(item=>item.id===mount.dataset.giftQr);if(order&&window.QRCode)new QRCode(mount,{text:order.giftMediaUrl,width:180,height:180,correctLevel:QRCode.CorrectLevel.M});else if(order)mount.textContent='QR could not load; use the public link above.';});
			main.querySelectorAll('[data-status]').forEach(select=>select.onchange=async()=>{try{await api('/api/seller/orders/status',{id:select.dataset.status,status:select.value});await refresh();notify('Order status updated.');}catch(error){notify(error.message);}});
			main.querySelectorAll('[data-message]').forEach(button=>button.onclick=()=>openConversationForOrder(button.dataset.message));
			main.querySelectorAll('[data-print-gift]').forEach(button=>button.onclick=()=>{const order=state.orders.find(item=>item.id===button.dataset.printGift);if(order?.giftMediaUrl)printGiftQr(order);});
			main.querySelectorAll('[data-save-gift]').forEach(button=>button.onclick=()=>{const order=state.orders.find(item=>item.id===button.dataset.saveGift);if(order?.giftMediaUrl)saveGiftQr(order);});
		}
		function renderProfile() {
			header('Profile',state.mode==='seller'?'seller-dashboard':'home');
			main.innerHTML=`<div class="profile-banner"></div><section class="profile-summary">${avatarMarkup(state.user,'U')}<div><strong style="font-size:19px">${escapeHtml(state.user?.name||'')}</strong><small style="display:block;color:#858585">${escapeHtml(state.user?.email||'')}</small><span style="color:#886319">Google account · ${state.user?.role==='customer'?'Flower customer':'Flower seller'}</span></div><div class="profile-stats"><div><strong>${state.orders.length}</strong>Orders</div><div><strong>${state.products.filter(product=>product.ownedByCurrentSeller).length}</strong>My flower listings</div><div><strong>🌸</strong>Handmade</div></div></section><div class="profile-links">${[['▦','Seller Account','Sign out and choose seller at sign-in','seller-dashboard'],['▣','My Orders','Track your flower orders','orders']].map(([icon,title,sub,view])=>`<div class="profile-link"><span class="link-icon">${icon}</span><span>${title}<small>${sub}</small></span><button data-profile-view="${view}">›</button></div>`).join('')}</div><button class="primary-btn" style="margin-top:16px;background:white;color:var(--gold);border:1px solid var(--gold)" id="logout">Sign Out</button>`;
			main.querySelectorAll('[data-profile-view]').forEach(button=>button.onclick=()=>button.dataset.profileView.startsWith('seller-')?setView(button.dataset.profileView):button.dataset.profileView==='orders'?setView('orders'):notify(`${button.dataset.profileView} is coming soon.`));
			document.getElementById('logout').onclick=signOutCurrentAccount;
		}
		function renderSellerProfile() {
			header('Seller Profile','seller-dashboard');
			main.innerHTML=`<div class="profile-banner"></div><section class="profile-summary">${avatarMarkup(state.user,'F')}<div><strong style="font:23px Georgia,serif">${escapeHtml(state.profile.shopName || '')}</strong><small style="display:block">${escapeHtml(state.user?.name||'')}</small><span style="color:var(--gold)">Seller account · Signed in with Google</span></div><div class="profile-stats"><div><strong>${state.products.filter(product=>product.ownedByCurrentSeller).length}</strong>My Flowers</div><div><strong>${state.orders.length}</strong>My Orders</div><div><strong>🌸</strong>Fresh</div></div></section><section class="profile-card"><h2>Shop Details</h2><form class="form" id="seller-profile-form"><label>Shop name<input name="shopName" maxlength="80" required value="${escapeHtml(state.profile.shopName || '')}"></label><label>Your name<input name="owner" maxlength="80" required value="${escapeHtml(state.profile.owner || state.user?.name || '')}"></label><label>Contact email<input name="email" type="email" maxlength="254" required value="${escapeHtml(state.profile.email || state.user?.email || '')}"></label><button class="primary-btn" type="submit">Save Profile</button></form></section><button class="secondary-btn" style="margin-top:10px" id="seller-logout">Sign Out</button>`;
			document.getElementById('seller-profile-form').onsubmit=async event=>{event.preventDefault();const values=Object.fromEntries(new FormData(event.currentTarget));try{await api('/api/seller/profile',values);await refresh();const nextView=state.pendingSellerView||'seller-profile';state.pendingSellerView='';setView(nextView);notify('Shop profile saved.');}catch(error){notify(error.message);}};
			document.getElementById('seller-logout').onclick=signOutCurrentAccount;
		}
		function renderMessages() {
			startMessagePolling();
			const seller=state.user?.role==='seller';
			const conversation=state.conversations.find(item=>item.id===state.selectedConversationId);
			if(!conversation) {
				state.selectedConversationId='';
				header('Messages',seller?'seller-dashboard':'orders');
				main.innerHTML=state.conversations.length?`<div class="order-list">${state.conversations.slice().reverse().map(item=>`<button class="order-card chat-thread" type="button" data-thread="${escapeHtml(item.id)}"><span class="order-thumb">✉</span><span class="order-info"><strong>${escapeHtml(item.otherName)}</strong><p>Order #${escapeHtml(item.orderId)}</p><small>${escapeHtml(item.messages.at(-1)?.text||'No messages yet')}</small></span><span>›</span></button>`).join('')}</div>`:'<div class="empty">No seller conversations yet. After you place an order, you can chat with its seller here.</div>';
				main.querySelectorAll('[data-thread]').forEach(button=>button.onclick=()=>{state.selectedConversationId=button.dataset.thread;renderMessages();});
				return;
			}
			header(conversation.otherName,seller?'seller-orders':'orders');
			main.innerHTML=`<button class="outline-btn" id="all-chats">‹ All chats</button><div class="message-person">${avatarMarkup({name:conversation.otherName},'U')}<div><strong>${escapeHtml(conversation.otherName)}</strong><small style="display:block">Order #${escapeHtml(conversation.orderId)}</small><small style="display:block;color:#888">${seller?'Reply to your customer here. New messages update automatically.':'Message your seller here. Replies update automatically.'}</small></div></div><div class="chat-messages">${conversation.messages.map(message=>`<div class="message ${message.senderRole===state.user?.role?'mine':''}"><span>${escapeHtml(message.text)}</span><small>${escapeHtml(message.createdAt)}</small></div>`).join('')}</div><form class="message-input" id="chat-form"><input name="text" maxlength="1000" required placeholder="${seller?'Reply to customer...':'Message the seller...'}" aria-label="${seller?'Reply to customer':'Message the seller'}"><button type="submit" aria-label="Send reply">➤</button></form>`;
			document.getElementById('all-chats').onclick=()=>{state.selectedConversationId='';renderMessages();};
			document.getElementById('chat-form').onsubmit=async event=>{event.preventDefault();const form=event.currentTarget;const input=form.elements.text;const button=form.querySelector('button');const text=input.value.trim();if(!text)return;input.disabled=true;button.disabled=true;try{await api('/api/messages/send',{conversationId:conversation.id,text});await refresh();main.querySelector('#chat-form [name="text"]')?.focus();}catch(error){notify(error.message);input.disabled=false;button.disabled=false;input.focus();}};
		}
		function startMessagePolling() {
			if(messagePollTimer)return;
			messagePollTimer=window.setInterval(async()=>{
				if(state.view!=='messages'||document.hidden||messagePollInFlight)return;
				messagePollInFlight=true;
				try {
					const data=await api('/api/state');
					const conversations=data.conversations||[];
					if(JSON.stringify(conversations)!==JSON.stringify(state.conversations)){
						const input=main.querySelector('#chat-form [name="text"]');
						const draft=input?.value||'';
						const wasFocused=document.activeElement===input;
						const messagePane=main.querySelector('.chat-messages');
						const wasNearBottom=messagePane&&messagePane.scrollHeight-messagePane.scrollTop-messagePane.clientHeight<80;
						const priorScroll=messagePane?.scrollTop||0;
						state.conversations=conversations;
						renderMessages();
						const updatedInput=main.querySelector('#chat-form [name="text"]');
						if(updatedInput){
							updatedInput.value=draft;
							if(wasFocused)updatedInput.focus();
						}
						const updatedPane=main.querySelector('.chat-messages');
						if(updatedPane)updatedPane.scrollTop=wasNearBottom?updatedPane.scrollHeight:priorScroll;
					}
				} catch(error) {
					console.error('Could not refresh chat messages.',error);
				} finally {
					messagePollInFlight=false;
				}
			},3000);
		}
		function stopMessagePolling() {
			if(messagePollTimer){
				window.clearInterval(messagePollTimer);
				messagePollTimer=null;
			}
		}
		function openConversationForOrder(orderId) {
			const conversation=state.conversations.find(item=>item.orderId===orderId);
			if(!conversation){notify('The seller chat for this order is not available.');return;}
			state.selectedConversationId=conversation.id;
			setView('messages');
		}
		function renderOrderDetail() {
			const order=state.selectedOrder;
			header(`Order #${order?.id||''}`,'orders');
			if(!order)return setView('orders');
			const subtotal=order.subtotalCents ?? order.totalCents;
			const protection=order.protectionCents ?? 0;
			const delivery=order.deliveryFeeCents ?? 0;
			main.innerHTML=`<section class="seller-card" style="margin-top:25px"><div class="progress">${['Pending','Preparing','Out for delivery','Delivered'].map((status,index)=>`<span class="${['Pending','Preparing','Out for delivery','Delivered'].indexOf(order.status)>=index?'active':''}">${['◷','▣','🛵','♧'][index]}</span>`).join('')}</div><div class="detail-line"><small>Pending</small><small>Preparing</small><small>Out for delivery</small><small>Delivered</small></div></section><section class="seller-card"><h3>${escapeHtml(order.customer)}</h3><p>${escapeHtml(order.email)}</p><p>${escapeHtml(order.address)}</p><hr>${order.lines.map(line=>`<div class="detail-line"><span>${escapeHtml(line.emoji)} ${escapeHtml(line.name)} × ${line.quantity}</span><span>${peso(line.priceCents*line.quantity)}</span></div>`).join('')}<p>With: QR message &nbsp; ▦</p></section><section class="seller-card"><div class="summary-line"><span>Sub Total</span><span>${peso(subtotal)}</span></div><div class="summary-line"><span>Protection Seal</span><span>${peso(protection)}</span></div><div class="summary-line"><span>Delivery Fee</span><span>${peso(delivery)}</span></div><hr><div class="summary-line total"><span>TOTAL</span><span>${peso(order.totalCents)}</span></div></section><button class="primary-btn" id="order-message">Message seller</button>`;
			document.getElementById('order-message').onclick=()=>openConversationForOrder(order.id);
		}
		function renderShopProfile() {
			const selected=state.selected;
			const listings=selected?state.products.filter(product=>product.sellerId===selected.sellerId):[];
			header(selected?.maker||'Flower Shop','search');
			main.innerHTML=selected?`<section class="profile-summary">${avatarMarkup({name:selected.sellerName},'F')}<div><strong style="font:23px Georgia,serif">${escapeHtml(selected.maker)}</strong><small style="display:block">📍 ${escapeHtml(selected.sellerLocation)}</small><small>${escapeHtml(selected.sellerName)}</small></div></section><div class="section-title"><h2>Flower Listings</h2></div><div class="product-grid">${listings.map(productCard).join('')}</div>`:'<div class="empty">Open a flower listing to view its shop.</div>';
			main.querySelectorAll('[data-product]').forEach(button=>button.onclick=()=>openProduct(button.dataset.product));
		}
		function renderPromos() {
			header('Promos & Rewards','home');
			main.innerHTML=`${[['DISCOUNT','10% OFF','Handmade Bouquets','🌹'],['LOYALTY','Double Points Weekend','Earn more with every purchase!','🎁'],['BUNDLE DEAL','Buy 2, Get 50% OFF','Selected items','💐'],['EXCLUSIVE','₱50 OFF','Your Next Order','🎀']].map(([tag,title,sub,emoji])=>`<div class="promo" style="margin:12px 0"><span class="promo-tag">${tag}</span><h2>${title}</h2><p>${sub}</p><span style="position:absolute;right:20px;top:50px;font-size:72px">${emoji}</span></div>`).join('')}`;
		}
		function render() {
			topbar.classList.remove('home-top');
			main.className='content';
			drawNav();
			const screens={
				signin:renderSignIn, home:renderHome, search:renderSearch, details:renderDetails, orders:renderOrders,
				checkout:renderCheckout, cart:renderCart, success:renderSuccess, builder:renderBuilder,
				'seller-dashboard':renderSellerDashboard, 'seller-products':renderSellerProducts,
				'add-product':renderAddProduct, 'seller-orders':renderSellerOrders,
				'seller-profile':renderSellerProfile, profile:renderProfile, messages:renderMessages,
				'order-detail':renderOrderDetail, 'shop-profile':renderShopProfile, promos:renderPromos
			};
			(screens[state.view] || renderHome)();
			drawNav();
		}
		if ('serviceWorker' in navigator && window.isSecureContext) {
			window.addEventListener('load', () => {
				navigator.serviceWorker.register('/service-worker.js').catch(error => {
					console.error('The app could not enable offline support.', error);
				});
			}, {once:true});
		}
		refresh();
	</script>
</body>
</html>
